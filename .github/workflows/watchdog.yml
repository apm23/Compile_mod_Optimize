name: Consolidation Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: compile-mod-optimize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-regression:
    name: Build / Regression Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Clean build
        run: gradle clean build --stacktrace --warning-mode all
      - name: Global Mending regression GameTest
        run: gradle runGametest --stacktrace
      - name: Dedicated server startup smoke
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 90s gradle runServer --args='nogui' > /tmp/compile-mod-server.log 2>&1
          code=$?
          set -e
          cat /tmp/compile-mod-server.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          if grep -E -i 'mixin apply failed|mixin.*error|invalid injection|injection error|exception.*compile_mod_server|failed to load.*compile_mod_server' /tmp/compile-mod-server.log; then exit 1; fi
          grep -q 'Done (' /tmp/compile-mod-server.log || { echo 'Server never reached ready state.'; exit 1; }
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-mod-server-baseline
          path: build/libs/*.jar
      - name: Upload dual artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-mod-dual-baseline
          path: dual/build/libs/*.jar
