name: Consolidation Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: compile-mod-optimize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-regression:
    name: Build / Regression Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Clean build
        run: gradle clean build --stacktrace --warning-mode all
      - name: Global Mending regression GameTest
        run: gradle runGametest --stacktrace
      - name: Final JAR integrity audit
        shell: bash
        run: |
          set -euo pipefail
          server_jar=$(find build/libs -maxdepth 1 -type f -name 'compile-mod-server-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*gametest*.jar' | head -n1)
          dual_jar=$(find dual/build/libs -maxdepth 1 -type f -name 'compile-mod-dual-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*gametest*.jar' | head -n1)
          test -n "$server_jar" && test -f "$server_jar"
          test -n "$dual_jar" && test -f "$dual_jar"
          echo "Auditing production artifacts: $server_jar + $dual_jar"
          jar tf "$server_jar" > /tmp/server-jar.txt
          jar tf "$dual_jar" > /tmp/dual-jar.txt

          require_entry() {
            local list="$1" entry="$2"
            grep -Fxq "$entry" "$list" || { echo "Missing packaged entry: $entry"; exit 1; }
          }
          require_class() {
            local list="$1" class="$2"
            grep -Eq "(^|/)${class}\\.class$" "$list" || { echo "Missing packaged class: $class"; exit 1; }
          }

          require_class /tmp/server-jar.txt 'CustomPickaxeMod'
          require_class /tmp/server-jar.txt 'ExperienceOrbMixin'
          require_entry /tmp/server-jar.txt 'compile_mod_server.mixins.json'

          require_class /tmp/dual-jar.txt 'CustomHotbarInventory'
          require_class /tmp/dual-jar.txt 'MerchantMenuMixin'
          require_class /tmp/dual-jar.txt 'ServerPlaceRecipeMixin'
          require_class /tmp/dual-jar.txt 'TaczGunSmithTableMenuMixin'
          require_class /tmp/dual-jar.txt 'GodHorseRuntime'
          require_class /tmp/dual-jar.txt 'StormcallRuntime'
          require_class /tmp/dual-jar.txt 'ForceAnvilMenuMixin'
          require_entry /tmp/dual-jar.txt 'data/minecraft/tags/block/anvil.json'
          require_entry /tmp/dual-jar.txt 'custom_hotbar_inventory.mixins.json'
          require_entry /tmp/dual-jar.txt 'assets/linkedshulker/blockstates/linked_shulker_box.json'
          require_entry /tmp/dual-jar.txt 'assets/linkedshulker/models/block/linked_shulker_box_open_7.json'
          require_entry /tmp/dual-jar.txt 'assets/linkedshulker/models/item/linked_shulker_box.json'

          # Keep unchanged interaction paths byte-for-byte locked to the proven standalone build.
          # Client page handling, CustomHotbarInventory and MerchantMenuMixin intentionally diverge
          # after targeted survival fixes, so those are guarded by explicit invariants instead.
          rm -rf /tmp/inventory-proven-audit
          mkdir -p /tmp/inventory-proven-audit
          (
            cd /tmp/inventory-proven-audit
            jar xf "$GITHUB_WORKSPACE/$dual_jar" \
              com/anjas/custominventory/client/HiddenRecipeContentsClient.class \
              com/anjas/custominventory/mixin/ServerPlaceRecipeMixin.class \
              com/anjas/custominventory/TaczCraftingCompat.class \
              com/anjas/custominventory/client/TaczCraftingClientBridge.class \
              com/anjas/custominventory/mixin/TaczGunSmithTableMenuMixin.class
          )
          cat > /tmp/inventory-proven.sha256 <<'EOF'
          b01908c23b0881ca4ab57c149d8966e0c7dbdfd2f6663b96a726479d4ed92a44  /tmp/inventory-proven-audit/com/anjas/custominventory/client/HiddenRecipeContentsClient.class
          12f96d52094b1884817798ac8792b07a80f5123f3fdd97ac4372a946f0939a7b  /tmp/inventory-proven-audit/com/anjas/custominventory/mixin/ServerPlaceRecipeMixin.class
          2a4febaeefcc257bdadc07c304855663622a7056dba2b5221f9e045d8d949b90  /tmp/inventory-proven-audit/com/anjas/custominventory/TaczCraftingCompat.class
          3ee226556c9c09e4ee74d5f9d9072cb91af8b111f1e443224dd177ec069cc618  /tmp/inventory-proven-audit/com/anjas/custominventory/client/TaczCraftingClientBridge.class
          fa03fc9200a2c64181d72eb194cf8fd8b9795fbc1b53041a5c7d6a5e8235cbf0  /tmp/inventory-proven-audit/com/anjas/custominventory/mixin/TaczGunSmithTableMenuMixin.class
          EOF
          sha256sum --check --strict /tmp/inventory-proven.sha256

          # Survival-fix invariants: server preserves carried items through page sync, client keeps
          # the carried item across the PageState acknowledgement, sort/merge is gated by the
          # actual inventory menu, and merchant close has a paged change-return path.
          grep -Fq 'player.containerMenu.setCarried(carried.copy())' dual/src/main/java/apm23/compilemod/dual/inventory/api/InventoryStorage.java
          grep -Fq 'pendingPageCarried=client.player==null?ItemStack.EMPTY:client.player.containerMenu.getCarried().copy()' dual/src/main/java/apm23/compilemod/dual/inventory/client/CustomHotbarInventoryClient.java
          grep -Fq 'client.player.containerMenu.setCarried(pendingPageCarried.copy())' dual/src/main/java/apm23/compilemod/dual/inventory/client/CustomHotbarInventoryClient.java
          grep -Fq 'p.containerMenu==p.inventoryMenu&&p.containerMenu.getCarried().isEmpty()' dual/src/main/java/apm23/compilemod/dual/inventory/core/CustomHotbarInventory.java
          grep -Fq 'custominventory$returnChangeAcrossPages' dual/src/main/java/apm23/compilemod/dual/inventory/mixin/MerchantMenuMixin.java

          if grep -Eq '^(com/tacz/|com/simibubi/create/)' /tmp/dual-jar.txt /tmp/server-jar.txt; then
            echo 'Forbidden TACZ/Create implementation classes were bundled.'
            exit 1
          fi
          echo "Artifact integrity passed: $server_jar + $dual_jar"
      - name: Dedicated server startup smoke
        shell: bash
        run: |
          mkdir -p run/mods
          rm -f run/mods/*.jar
          find build/libs -maxdepth 1 -type f -name 'compile-mod-server-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*gametest*.jar' -exec cp {} run/mods/ \;
          find dual/build/libs -maxdepth 1 -type f -name 'compile-mod-dual-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*gametest*.jar' -exec cp {} run/mods/ \;
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 90s gradle :runServer --args='nogui' > /tmp/compile-mod-server.log 2>&1
          code=$?
          set -e
          cat /tmp/compile-mod-server.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          if grep -E -i 'mixin apply failed|invalid injection|injection error|exception.*compile_mod_(server|dual)|failed to load.*compile_mod_(server|dual)' /tmp/compile-mod-server.log; then exit 1; fi
          grep -q 'Done (' /tmp/compile-mod-server.log || { echo 'Server never reached ready state.'; exit 1; }
          grep -q 'Inventory sort/merge startup self-tests passed' /tmp/compile-mod-server.log || { echo 'Inventory runtime self-tests did not execute.'; exit 1; }
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-mod-server-baseline
          path: |
            build/libs/compile-mod-server-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*gametest*.jar
      - name: Upload dual artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-mod-dual-baseline
          path: |
            dual/build/libs/compile-mod-dual-*.jar
            !dual/build/libs/*-sources.jar
            !dual/build/libs/*-dev.jar
            !dual/build/libs/*gametest*.jar
